name: Build Coleman Times

on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out newspaper
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build today's edition
        run: python scripts/build_edition.py

      - name: Publish edition
        run: |
          git config user.name "Coleman Times Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editions/latest.json comics/used comics/available
          git diff --cached --quiet || git commit -m "Publish daily Coleman Times"
          git push
