name: Build Coleman Times

on:
  schedule:
    # 10:30 UTC = 5:30 AM CDT
    - cron: '30 10 * * *'
    # 11:30 UTC = 5:30 AM CST
    - cron: '30 11 * * *'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out newspaper
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check Central Time
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo("America/Chicago"))

          print("Central time:", now.strftime("%Y-%m-%d %H:%M:%S %Z"))

          if now.hour != 5 or now.minute != 30:
              print("Not the 5:30 AM Central run. Exiting.")
              raise SystemExit(0)
          PY

      - name: Build today's edition
        run: python scripts/build_edition.py

      - name: Publish edition
        run: |
          git config user.name "Coleman Times Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add editions/latest.json comics/used comics/available

          git diff --cached --quiet || git commit -m "Publish daily Coleman Times"

          git push
